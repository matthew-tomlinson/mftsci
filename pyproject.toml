[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mftsci"
version = "0.0.1.dev20260824"
description = "A package for scientific analysis and communication."
readme = "README.rst"
authors = [
  {name = "Matthew Frank Tomlinson", email = "mtthw.tomlinson@gmail.com"}
]
maintainers = [
  {name = "Matthew Frank Tomlinson", email = "mtthw.tomlinson@gmail.com"}
]
classifiers = [

]
license = {text = "MIT license"}
requires-python = ">=3.9"
dependencies = [
  "numpy>=2.0",
  "scipy",
  "pandas",
  "matplotlib>=3.8",
  "scikit-learn",
  "numdifftools",
  "jinja2",
]

[project.optional-dependencies]
statsmodels = [
    "statsmodels",
]
linalg_design = [
    "oapackage",
]
signal = [
    "emd",
    "EMD-signal",
]
dev = [
    "coverage",  # testing
    "mypy",  # linting
    "pytest",  # testing
    "ruff",  # linting
]

[project.urls]

bugs = "https://github.com/matthew-tomlinson/mftsci/issues"
changelog = "https://github.com/matthew-tomlinson/mftsci/blob/master/changelog.md"
homepage = "https://github.com/matthew-tomlinson/mftsci"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"*" = ["*.*"]




# Mypy
# ----

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

